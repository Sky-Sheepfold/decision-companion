spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: decision-companion

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST}
          port: ${CHROMA_PORT}
        collection-name: companion_profiles
        tenant-name: default_tenant
        database-name: default_database
        initialize-schema: true

  datasource:
    url: jdbc:mysql://${SERVER_IP}:3306/companion?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

server:
  port: 8080

decision-companion:
  memory:
    retrieval:
      section-limit: 5
      text-max-length: 200
      semantic-top-k: 5
      semantic-similarity-threshold: 0.3
      semantic-type-quota: 2
      core:
        confidence-threshold: 0.85
        value-limit: 3
        fear-limit: 2
        total-limit: 5
      decision:
        default-limit: 3
        max-limit: 5
        candidate-multiplier: 3
        min-token-length: 2
    extract:
      enabled: true
      concurrency: 3
      poll-interval-ms: 5000
      orphan-recover-ms: 60000
      batch-size: 10
      max-attempts: 5
      orphan-timeout-minutes: 30
      retry-delay-ms: 15000
    posture-gate:
      mode: off

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  is-read-cookie: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

logging:
  level:
    com.sky.decisioncompanion: DEBUG
    org.springframework.ai: DEBUG
