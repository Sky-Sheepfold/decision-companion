spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: decision-companion

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST}
          port: ${CHROMA_PORT}
        collection-name: companion_profiles
        tenant-name: default_tenant
        database-name: default_database
        initialize-schema: true

  datasource:
    url: jdbc:mysql://${SERVER_IP}:3306/companion?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

server:
  port: 8080

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  is-read-cookie: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

logging:
  level:
    com.sky.decisioncompanion: DEBUG
    org.springframework.ai: DEBUG
