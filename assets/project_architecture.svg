<svg width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">人生决策伙伴 Agent 架构图</title>
  <desc id="desc">展示人生决策伙伴 Agent 的前端、后端 Agent 编排、Memory RAG、Agent Tools、模型调用、MySQL 与 Chroma 记忆存储闭环。</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F6F1EA"/>
    </linearGradient>

    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B2740" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526071" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrowWarm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A8663F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      .bg { fill: url(#pageBg); }
      .title { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #667085; }
      .group-title { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #1F2937; }
      .box-title { font: 760 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #1E293B; }
      .box-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #667085; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #64748B; }
      .note { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #7C4B2E; }
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; filter: url(#shadow); }
      .frontend { fill: #EFF6FF; stroke: #60A5FA; }
      .backend { fill: #F8FAFC; stroke: #CBD5E1; }
      .rag { fill: #EEFDF5; stroke: #34D399; }
      .tool { fill: #FFF7ED; stroke: #FDBA74; }
      .ai { fill: #F5F3FF; stroke: #A78BFA; }
      .mysql { fill: #EEF6FF; stroke: #3B82F6; }
      .chroma { fill: #F0FDFA; stroke: #14B8A6; }
      .log { fill: #FEFCE8; stroke: #EAB308; }
      .chip { fill: #FFFFFF; stroke: #D8E0EA; stroke-width: 1; }
      .chip-warm { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1; }
      .arrow { stroke: #526071; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-warm { stroke: #A8663F; stroke-width: 1.9; fill: none; marker-end: url(#arrowWarm); }
      .arrow-soft { stroke: #94A3B8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 6; }
      .band { fill: rgba(255,255,255,0.58); stroke: #E5E7EB; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820" rx="28"/>

  <text class="title" x="640" y="46" text-anchor="middle">人生决策伙伴 Agent 架构图</text>
  <text class="subtitle" x="640" y="74" text-anchor="middle">长期画像沉淀 · Memory RAG 召回 · Agent 工具编排 · 可治理记忆闭环</text>

  <!-- Top flow -->
  <rect class="panel" x="48" y="118" width="154" height="96" rx="16"/>
  <text class="box-title" x="125" y="150" text-anchor="middle">用户</text>
  <text class="box-sub" x="125" y="174" text-anchor="middle">人生选择</text>
  <text class="box-sub" x="125" y="194" text-anchor="middle">倾诉 / 复盘 / 规划</text>

  <rect class="panel frontend" x="250" y="104" width="210" height="124" rx="18"/>
  <text class="box-title" x="355" y="136" text-anchor="middle">React 前端</text>
  <rect class="chip" x="275" y="154" width="160" height="24" rx="8"/>
  <text class="tiny" x="355" y="170" text-anchor="middle">登录 / 冷启动 / 对话</text>
  <rect class="chip" x="275" y="184" width="160" height="24" rx="8"/>
  <text class="tiny" x="355" y="200" text-anchor="middle">档案页 / 记忆罗盘</text>

  <rect class="panel backend" x="508" y="92" width="264" height="148" rx="18"/>
  <text class="box-title" x="640" y="124" text-anchor="middle">Spring Boot API</text>
  <rect class="chip" x="532" y="146" width="98" height="26" rx="8"/>
  <text class="tiny" x="581" y="163" text-anchor="middle">Auth</text>
  <rect class="chip" x="642" y="146" width="104" height="26" rx="8"/>
  <text class="tiny" x="694" y="163" text-anchor="middle">Agent</text>
  <rect class="chip" x="532" y="180" width="98" height="26" rx="8"/>
  <text class="tiny" x="581" y="197" text-anchor="middle">Profile</text>
  <rect class="chip" x="642" y="180" width="104" height="26" rx="8"/>
  <text class="tiny" x="694" y="197" text-anchor="middle">Onboarding</text>
  <text class="box-sub" x="640" y="225" text-anchor="middle">JWT 鉴权 · REST · SSE Stream</text>

  <rect class="panel ai" x="834" y="118" width="188" height="96" rx="18"/>
  <text class="box-title" x="928" y="151" text-anchor="middle">DashScope</text>
  <text class="box-sub" x="928" y="176" text-anchor="middle">Spring AI ChatClient</text>
  <text class="box-sub" x="928" y="196" text-anchor="middle">qwen-plus</text>

  <rect class="panel" x="1070" y="118" width="162" height="96" rx="18"/>
  <text class="box-title" x="1151" y="151" text-anchor="middle">助手回复</text>
  <text class="box-sub" x="1151" y="176" text-anchor="middle">决策分析</text>
  <text class="box-sub" x="1151" y="196" text-anchor="middle">追问 / 建议</text>

  <path class="arrow" d="M 202 166 L 250 166"/>
  <path class="arrow" d="M 460 166 L 508 166"/>
  <path class="arrow" d="M 772 166 L 834 166"/>
  <path class="arrow" d="M 1022 166 L 1070 166"/>

  <!-- Backend internals -->
  <rect class="band" x="58" y="280" width="1164" height="226" rx="22"/>
  <text class="group-title" x="90" y="316">后端核心编排</text>

  <rect class="panel backend" x="92" y="342" width="210" height="96" rx="16"/>
  <text class="box-title" x="197" y="374" text-anchor="middle">DecisionAgentService</text>
  <text class="box-sub" x="197" y="398" text-anchor="middle">保存消息 · 调用模型</text>
  <text class="box-sub" x="197" y="418" text-anchor="middle">编排工具与异步提炼</text>

  <rect class="panel rag" x="352" y="326" width="264" height="128" rx="18"/>
  <text class="box-title" x="484" y="358" text-anchor="middle">Memory RAG</text>
  <rect class="chip" x="378" y="378" width="212" height="24" rx="8"/>
  <text class="tiny" x="484" y="394" text-anchor="middle">ProfileAdvisor 注入 prompt</text>
  <rect class="chip" x="378" y="408" width="212" height="24" rx="8"/>
  <text class="tiny" x="484" y="424" text-anchor="middle">MemoryRetrievalService 混合召回</text>

  <rect class="panel rag" x="352" y="462" width="264" height="30" rx="12"/>
  <text class="note" x="484" y="482" text-anchor="middle">intent · query rewrite · candidateTopK · rerankReason</text>

  <rect class="panel tool" x="672" y="326" width="230" height="128" rx="18"/>
  <text class="box-title" x="787" y="358" text-anchor="middle">Agent Tools</text>
  <rect class="chip-warm" x="696" y="378" width="182" height="24" rx="8"/>
  <text class="tiny" x="787" y="394" text-anchor="middle">searchDecisionHistory</text>
  <rect class="chip-warm" x="696" y="408" width="182" height="24" rx="8"/>
  <text class="tiny" x="787" y="424" text-anchor="middle">searchSemanticMemory</text>
  <rect class="chip-warm" x="696" y="438" width="182" height="24" rx="8"/>
  <text class="tiny" x="787" y="454" text-anchor="middle">matrix / updateProfile</text>

  <rect class="panel backend" x="956" y="342" width="220" height="96" rx="16"/>
  <text class="box-title" x="1066" y="374" text-anchor="middle">ProfileExtractService</text>
  <text class="box-sub" x="1066" y="398" text-anchor="middle">对话后异步画像提炼</text>
  <text class="box-sub" x="1066" y="418" text-anchor="middle">高/中/低置信度路由</text>

  <path class="arrow" d="M 302 390 L 352 390"/>
  <path class="arrow" d="M 616 390 L 672 390"/>
  <path class="arrow-soft" d="M 902 390 L 956 390"/>
  <path class="arrow-warm" d="M 1066 438 C 1066 520 1008 542 934 542"/>

  <!-- Storage -->
  <rect class="band" x="58" y="548" width="1164" height="196" rx="22"/>
  <text class="group-title" x="90" y="584">记忆与观测存储</text>

  <rect class="panel mysql" x="92" y="614" width="280" height="92" rx="18"/>
  <text class="box-title" x="232" y="644" text-anchor="middle">MySQL</text>
  <text class="box-sub" x="232" y="668" text-anchor="middle">用户 / 会话 / 五类画像</text>
  <text class="box-sub" x="232" y="688" text-anchor="middle">候选记忆 / 治理审计 / 关联表</text>

  <rect class="panel chroma" x="430" y="614" width="260" height="92" rx="18"/>
  <text class="box-title" x="560" y="644" text-anchor="middle">Chroma Vector Store</text>
  <text class="box-sub" x="560" y="668" text-anchor="middle">typed memory chunk</text>
  <text class="box-sub" x="560" y="688" text-anchor="middle">userId 隔离 · memoryType · scene evidence</text>

  <rect class="panel log" x="746" y="614" width="220" height="92" rx="18"/>
  <text class="box-title" x="856" y="644" text-anchor="middle">观测日志</text>
  <text class="box-sub" x="856" y="668" text-anchor="middle">memory_retrieval_log</text>
  <text class="box-sub" x="856" y="688" text-anchor="middle">agent_tool_call_log</text>

  <rect class="panel tool" x="1022" y="614" width="154" height="92" rx="18"/>
  <text class="box-title" x="1099" y="644" text-anchor="middle">待确认区</text>
  <text class="box-sub" x="1099" y="668" text-anchor="middle">confirm / reject</text>
  <text class="box-sub" x="1099" y="688" text-anchor="middle">correct / delete</text>

  <path class="arrow" d="M 430 454 C 330 506 270 540 232 614"/>
  <path class="arrow" d="M 484 492 C 500 538 530 574 560 614"/>
  <path class="arrow-soft" d="M 787 454 C 804 524 830 570 856 614"/>
  <path class="arrow-warm" d="M 1038 438 C 1030 520 1080 560 1099 614"/>
  <path class="arrow-warm" d="M 1066 438 C 910 530 640 562 560 614"/>
  <path class="arrow-warm" d="M 1066 438 C 820 535 356 562 232 614"/>

  <!-- Retrieval arrows back to RAG -->
  <path class="arrow-soft" d="M 232 614 C 222 548 285 488 352 430"/>
  <path class="arrow-soft" d="M 560 614 C 560 552 530 504 508 454"/>

  <!-- Legend -->
  <rect class="panel" x="360" y="764" width="560" height="34" rx="14"/>
  <text class="tiny" x="640" y="785" text-anchor="middle">实线：主调用链路 · 虚线：召回/观测 · 暖色箭头：画像沉淀与记忆写入闭环</text>
</svg>
